<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMathSolver | AI Interface</title>
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --bg: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* پس‌زمینه‌ی متحرک */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0c 100%);
            z-index: -1;
        }

        /* هدر */
        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--glass);
            backdrop-filter: blur(10px);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* بخش نمایش پیام‌ها (Chat Area) */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 15px;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .user-msg {
            align-self: flex-end;
            background: var(--secondary);
            border-bottom-left-radius: 2px;
        }

        .ai-msg {
            align-self: flex-start;
            background: var(--glass);
            border: 1px solid var(--glass);
            border-bottom-right-radius: 2px;
        }

        .image-preview {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid var(--primary);
        }

        /* بخش ورودی (Input Area) */
        .input-area {
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--glass);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: var(--glass);
            border-radius: 30px;
            padding: 5px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            outline: none;
            font-size: 1rem;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        #file-input { display: none; }

        /* انیمیشن اسکن */
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        .scanning::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            animation: scan 2s infinite linear;
        }
    </style>
</head>
<body>

<header>
    <h1>SMART MATH SOLVER AI</h1>
</header>

<div id="chat-container">
    <div class="message ai-msg">سلام ارباب! آماده‌ی حلِ معماهای ریاضی هستم. عکسی بفرست یا سوالت رو بنویس.</div>
</div>

<div class="input-area">
    <div class="input-wrapper">
        <label for="file-input" class="icon-btn">📷</label>
        <input type="file" id="file-input" accept="image/*">
        
        <input type="text" id="user-input" placeholder="سوال ریاضی خود را اینجا بنویسید...">
        
        <button class="icon-btn" id="send-btn">🚀</button>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const fileInput = document.getElementById('file-input');

    function addMessage(text, type, isImage = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type === 'user' ? 'user-msg' : 'ai-msg'}`;
        
        if (isImage) {
            const img = document.createElement('img');
            img.src = text;
            img.className = 'image-preview';
            msgDiv.appendChild(img);
        } else {
            msgDiv.innerText = text;
        }

        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = '';

        // شبیه‌سازی پاسخ هوش مصنوعی
        setTimeout(() => {
            addMessage("در حال پردازش ریاضیات... (این بخش در نسخه اصلی به سرور متصل می‌شود)", 'ai');
        }, 1000);
    }

    fileInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                addMessage(e.target.result, 'user', true);
                setTimeout(() => {
                    addMessage("تصویر دریافت شد. در حال اسکن و تحلیل مراحل ریاضی...", 'ai');
                }, 1500);
            };
            reader.readAsDataURL(file);
        }
    });

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSend();
    });
</script>

</body>
  </html>
